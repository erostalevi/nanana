name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  api:
    name: API lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from the packageManager field (pnpm@12)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api lint
      - run: pnpm --filter api build
      - run: pnpm --filter api test

  api-e2e:
    name: API e2e (throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nanana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nanana_test
      BASE_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test:e2e

  web:
    name: Web build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect apps/web
        id: detect
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "apps/web not present, skipping"; fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter web build
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter web --if-present test

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect cli
        id: detect
        run: |
          if [ -f cli/go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "cli/go.mod not present, skipping"; fi
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - if: steps.detect.outputs.present == 'true'
        working-directory: cli
        run: go vet ./...
      - if: steps.detect.outputs.present == 'true'
        working-directory: cli
        run: go test -race ./...

  deploy-files:
    name: Shell scripts and container checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find deploy infra -type f \( -name '*.sh' -o -name nanana-backup \) | sort)
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck "${files[@]}"
      - name: Build the Postgres image (WAL-G checksum, config)
        run: docker build -t nanana-postgres:ci deploy/postgres
      - name: Validate the Caddyfile
        run: |
          docker run --rm \
            -e AWS_REGION=us-east-1 -e HOSTED_ZONE_ID=Z0000000000000 \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint sh caddy:2.10-builder -c '
              xcaddy build --with github.com/caddy-dns/route53 --output /tmp/caddy >/dev/null 2>&1 &&
              /tmp/caddy validate --config /etc/caddy/Caddyfile'

  infra:
    name: OpenTofu fmt, validate, plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for the read-only plan role
      pull-requests: read
    defaults:
      run:
        working-directory: infra
    env:
      PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      FORWARD_EMAIL: ${{ secrets.FORWARD_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.x
          tofu_wrapper: false

      - name: tofu fmt -check
        run: tofu fmt -check -recursive

      - name: tofu validate (no backend)
        run: |
          tofu init -backend=false -input=false
          tofu validate

      - name: Check plan prerequisites
        id: plan_gate
        run: |
          if [ -z "$PLAN_ROLE_ARN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### tofu plan skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository variable \`AWS_PLAN_ROLE_ARN\` is not set." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$ALERT_EMAIL" ] || [ -z "$FORWARD_EMAIL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### tofu plan skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository secrets \`ALERT_EMAIL\` and \`FORWARD_EMAIL\` are not set (emails are never committed)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (plan role, read-only)
        if: steps.plan_gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: tofu init (S3 backend)
        if: steps.plan_gate.outputs.run == 'true'
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          tofu init -input=false -reconfigure -backend-config="bucket=nanana-tfstate-${account_id}"

      - name: tofu plan
        if: steps.plan_gate.outputs.run == 'true'
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_forward_email: ${{ secrets.FORWARD_EMAIL }}
        run: |
          set +e
          # -lock=false: the plan role is read-only and must never block an apply.
          tofu plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          {
            echo "### tofu plan"
            case "$code" in
              0) echo "No changes. Infrastructure matches the configuration." ;;
              2) echo "Changes detected (shown below)." ;;
              *) echo "Plan failed." ;;
            esac
            echo
            echo '```'
            tail -n 400 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then cat plan.txt; exit 1; fi
