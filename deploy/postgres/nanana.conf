# Postgres tuning for a 1 GB host shared with the API and Caddy
# (container limit ~280 MB, plus swap). Loaded with -c config_file=...
# All other settings keep their defaults.

listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 40

# --- memory ---
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 32MB
huge_pages = off

# --- durability (data safety first) ---
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on

# --- WAL archiving to S3 via WAL-G (point-in-time recovery) ---
wal_level = replica
max_wal_senders = 0
archive_mode = on
archive_command = '/usr/local/bin/wal-g wal-push %p'
archive_timeout = 120
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- logging (stdout, rotated by docker) ---
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_min_duration_statement = 1000
log_temp_files = 0
log_timezone = 'UTC'
timezone = 'UTC'
